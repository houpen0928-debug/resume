name: Resume validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [codex/resume-executive-0915]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build with strict front matter
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check resume pages and assets
        run: python3 scripts/check_resume.py
      - uses: actions/upload-artifact@v4
        with:
          name: resume-site-preview
          path: _site/
          retention-days: 7
